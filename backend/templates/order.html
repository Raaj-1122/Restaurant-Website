<form method="POST">

    <input
        type="text"
        name="customer_name"
        placeholder="Your Name"
        required>

    <br><br>

    <input
        type="text"
        name="phone"
        placeholder="Phone Number"
        required>

    <br><br>

    <button type="submit">
        Place Order
    </button>

</form>

{% if success %}
<h2>✅ Order Placed Successfully</h2>
{% endif %}
